<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    circle { stroke: #111; fill: none; }
    .dot { fill: #111; stroke: none; }
    @media (prefers-color-scheme: dark) {
      circle { stroke: #f0efeb; }
      .dot { fill: #f0efeb; }
    }
  </style>
  <circle cx="16" cy="16" r="12.5" stroke-width="2.5"/>
  <circle class="dot" cx="16" cy="16" r="4"/>
</svg>
